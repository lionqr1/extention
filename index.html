<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Clicker & Auto Filler</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
    }

    button {
      padding: 14px 20px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffcc00;
      font-weight: bold;
    }

    button:hover {
      background: #ffdd33;
    }

    input {
      padding: 12px;
      width: 260px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      margin-top: 20px;
    }

    .target-area {
      margin-top: 40px;
      padding: 20px;
      background: #111;
      border-radius: 10px;
      display: inline-block;
    }

    .target-area button {
      background: #0099ff;
    }

    .target-area button:hover {
      background: #33aaff;
    }
  </style>
</head>
<body>

<h1>Auto Clicker & Auto Filler</h1>

<p>Use the buttons below to auto-click or auto-fill the demo elements.</p>

<button onclick="autoClick()">Auto Click Button Below</button>
<button onclick="autoFill()">Auto Fill Input Below</button>

<div class="target-area">
  <h2>Demo Area</h2>

  <button id="demoBtn" onclick="alert('Button clicked!')">
    Demo Button
  </button>

  <br><br>

  <input id="demoInput" type="text" placeholder="This will be auto-filled">
</div>

<script>
  function autoClick() {
    const btn = document.getElementById('demoBtn');
    if (btn) {
      btn.click();
    }
  }

  function autoFill() {
    const input = document.getElementById('demoInput');
    if (input) {
      input.value = "Auto-filled by script!";
    }
  }
</script>

</body>
</html>
